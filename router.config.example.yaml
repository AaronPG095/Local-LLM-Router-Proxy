server:
  host: "127.0.0.1"
  port: 8787
  connect_timeout_ms: 5000
  first_byte_timeout_ms: 30000

providers:
  gemini:
    type: gemini
    base_url: "https://generativelanguage.googleapis.com"
    api_key_env: "GEMINI_API_KEY"
    pricing_per_1m:
      gemini-2.5-pro: { input: 1.25, output: 10.00, cached_input: 0.31 }
      gemini-2.5-flash: { input: 0.15, output: 0.60, cached_input: 0.0375 }
  openai:
    type: openai
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    pricing_per_1m:
      gpt-4o: { input: 2.50, output: 10.00, cached_input: 1.25 }
      gpt-4o-mini: { input: 0.15, output: 0.60, cached_input: 0.075 }
  anthropic:
    type: anthropic
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    pricing_per_1m:
      claude-sonnet-4-20250514: { input: 3.00, output: 15.00, cached_input: 0.30 }
  ollama:
    type: openai_compatible
    base_url: "http://127.0.0.1:11434/v1"
    pricing_per_1m:
      gemma3:4b: { input: 0.0, output: 0.0 }
      qwen3:8b: { input: 0.0, output: 0.0 }
      gemma3:12b: { input: 0.0, output: 0.0 }
      qwen2.5-coder:14b: { input: 0.0, output: 0.0 }
  # Optional standing free-tier cloud pool (non-sensitive tasks only; use X-Router-Privacy: local to force Ollama)
  groq:
    type: openai_compatible
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    max_rpm: 25
    max_rpd: 1000
    pricing_per_1m:
      llama-3.3-70b-versatile: { input: 0.0, output: 0.0 }
  openrouter_free:
    type: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    max_rpm: 15
    max_rpd: 45
    pricing_per_1m:
      meta-llama/llama-3.3-70b-instruct:free: { input: 0.0, output: 0.0 }
  mistral_free:
    type: openai_compatible
    base_url: "https://api.mistral.ai/v1"
    api_key_env: "MISTRAL_API_KEY"
    max_rpm: 20
    max_rpd: 500
    pricing_per_1m:
      codestral-latest: { input: 0.0, output: 0.0 }

routing:
  default_target: "gemini:gemini-2.5-flash"
  never_downgrade:
    headers:
      X-Router-Tier: "frontier"
    model_aliases:
      - "frontier"
      - "reasoning"
    when_reasoning_params_present: true
  rules:
    - name: "fast-mechanical-offload"
      match:
        headers: { X-Router-Task: ["commit_msg", "log_trim", "classify"] }
        has_tools: false
      target: "ollama:gemma3:4b"
      fallback_chain: ["gemini:gemini-2.5-flash", "openai:gpt-4o-mini"]
      semantic_cache: true
    - name: "local-summarize"
      match:
        headers: { X-Router-Task: ["summarize"] }
        has_tools: false
      target: "ollama:qwen3:8b"
      fallback_chain: ["gemini:gemini-2.5-flash"]
      semantic_cache: true
    - name: "deep-local-code-and-synthesis"
      match:
        headers: { X-Router-Task: ["pr_summary", "explain", "draft_tests", "boilerplate"] }
        has_tools: false
      target: "ollama:qwen2.5-coder:14b"
      fallback_chain: ["ollama:gemma3:12b", "ollama:qwen3:8b"]
      semantic_cache: false

cache:
  l1_exact:
    enabled: true
    ttl_seconds: 86400
    max_entries: 10000
    require_deterministic: true
  l2_semantic:
    enabled: false
    embedding_provider: "ollama:nomic-embed-text"
    similarity_threshold: 0.94
    ttl_seconds: 21600
    max_candidates: 500

compression:
  enabled: true
  keep_recent_messages: 6
  min_tool_result_chars: 4000
  head_chars: 800
  tail_chars: 800
  anthropic_cache_control: true

budgets:
  session:
    max_tokens: 200000
    max_cost_usd: 2.00
    soft_warn_pct: 0.80
    hard_action: "downgrade"
    downgrade_target: "ollama:qwen2.5-coder:14b"
  project_daily:
    max_tokens: 1000000
    max_cost_usd: 10.00
    soft_warn_pct: 0.80
    hard_action: "block"

telemetry:
  sqlite_path: "./data/router.db"
  jsonl_path: "./data/telemetry.jsonl"
  otlp_endpoint: ""
